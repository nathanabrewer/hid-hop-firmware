# Minimal config for Raytac CX-40 dongle
CONFIG_GPIO=n
CONFIG_LOG=n
CONFIG_SERIAL=n
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_PRINTK=n

# Flash offset for Nordic Open DFU bootloader
CONFIG_FLASH_LOAD_OFFSET=0x1000

# Force internal RC oscillator
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_XTAL=n

