#
# Board-specific config for Raytac MDBT50Q-CX-40 dongle
#

# Disable console/UART (no physical UART on dongle)
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_SERIAL=n
CONFIG_UART_ASYNC_API=n
CONFIG_UART_INTERRUPT_DRIVEN=n
CONFIG_NRFX_UARTE0=n

# Use RTT for logging
CONFIG_USE_SEGGER_RTT=y
CONFIG_LOG_BACKEND_RTT=y
CONFIG_LOG_BACKEND_UART=n
CONFIG_RTT_CONSOLE=n
CONFIG_LOG_PRINTK=y

# Bootloader settings for Open DFU
CONFIG_BOARD_HAS_NRF5_BOOTLOADER=y

# Use RC oscillator (more reliable on Raytac)
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y


