# Board-specific config for Seeed XIAO nRF52840

# Enable SERIAL for USB CDC ACM (virtual UART over USB)
CONFIG_SERIAL=y

# Logging via RTT or CDC-ACM
CONFIG_LOG_BACKEND_UART=n

# Flash offset for Adafruit UF2 bootloader
CONFIG_FLASH_LOAD_OFFSET=0x27000

# XIAO has external 32kHz crystal - better accuracy than RC
CONFIG_CLOCK_CONTROL_NRF_K32SRC_XTAL=y

# Keep DK library for LED support
CONFIG_DK_LIBRARY=y

# PWM for RC servo/ESC outputs
CONFIG_PWM=y
