# Board-specific config for Raytac MDBT50Q-CX-40 dongle

# No UART on this dongle
CONFIG_SERIAL=n

# Logging via RTT only
CONFIG_LOG_BACKEND_UART=n

# Flash offset for Nordic Open DFU bootloader
CONFIG_FLASH_LOAD_OFFSET=0x1000

# Force internal RC oscillator (dongle has no external crystal)
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y

# Keep DK library for LED/button support
CONFIG_DK_LIBRARY=y
