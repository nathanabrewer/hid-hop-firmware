# Board-specific config for Raytac MDBT50Q-CX-40 dongle

# Enable SERIAL for USB CDC ACM (virtual UART over USB)
# No hardware UART pins exposed, but CDC ACM needs SERIAL subsystem
CONFIG_SERIAL=y

# Logging via RTT only (no hardware UART for logs)
CONFIG_LOG_BACKEND_UART=n

# Flash offset for Nordic Open DFU bootloader
CONFIG_FLASH_LOAD_OFFSET=0x1000

# Force internal RC oscillator (dongle has no external crystal)
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y

# Keep DK library for LED/button support
CONFIG_DK_LIBRARY=y
