#
# Brewer BLE HID Bridge - Project Configuration
#

# ==========================================
# Serial Configuration - board specific
# ==========================================
# UART disabled by default (dongles have no UART)
# Add board overlay to enable for dev boards with J-Link

# ==========================================
# USB CDC ACM Serial Port (JSONL messaging)
# ==========================================
CONFIG_USB_CDC_ACM=y
CONFIG_UART_LINE_CTRL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_RING_BUFFER=y

# ==========================================
# GPIO Configuration
# ==========================================
CONFIG_GPIO=y
CONFIG_INPUT=y
CONFIG_DK_LIBRARY=y

# ==========================================
# ADC Configuration (for analog inputs) - DISABLED for now
# ==========================================
CONFIG_ADC=n
# CONFIG_ADC_NRFX_SAADC=y

# ==========================================
# Memory Configuration
# ==========================================
CONFIG_HEAP_MEM_POOL_SIZE=16384
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# Mesh requires more connections for proxy
CONFIG_BT_MAX_CONN=2

# ==========================================
# Bluetooth Configuration
# ==========================================
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_OBSERVER=y
CONFIG_BT_DEVICE_NAME="HID-HOP"
CONFIG_BT_DEVICE_APPEARANCE=961
CONFIG_BT_MAX_PAIRED=3

# BLE Security - TEMPORARILY RELAXED for debugging
# TODO: Re-enable these after debugging:
# CONFIG_BT_BONDING_REQUIRED=y
# CONFIG_BT_SMP_SC_ONLY=y
CONFIG_BT_SMP=y
CONFIG_BT_BONDABLE=y
CONFIG_BT_BONDING_REQUIRED=n
CONFIG_BT_SMP_SC_ONLY=n
CONFIG_BT_FIXED_PASSKEY=n
CONFIG_BT_DEBUG_SMP=y

# BLE Settings/Storage for bonding
CONFIG_BT_SETTINGS=y
CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y

# GATT Configuration
CONFIG_BT_GATT_DYNAMIC_DB=y
CONFIG_BT_ATT_PREPARE_COUNT=2

# ==========================================
# BLE Mesh Configuration
# ==========================================
CONFIG_BT_MESH=y
CONFIG_BT_MESH_RELAY=y
CONFIG_BT_MESH_PB_ADV=y
CONFIG_BT_MESH_PROVISIONER=y
CONFIG_BT_MESH_GATT_PROXY=y
CONFIG_BT_MESH_PB_GATT=y

# Mesh advertising/transmit settings
CONFIG_BT_MESH_ADV_BUF_COUNT=16
CONFIG_BT_MESH_LOOPBACK_BUFS=8
CONFIG_BT_MESH_RELAY_BUF_COUNT=16
CONFIG_BT_MESH_TX_SEG_MAX=6
CONFIG_BT_MESH_RX_SEG_MAX=6
CONFIG_BT_MESH_RX_SEG_MSG_COUNT=2
CONFIG_BT_MESH_NETWORK_TRANSMIT_COUNT=3
CONFIG_BT_MESH_NETWORK_TRANSMIT_INTERVAL=20

# Mesh crypto - explicitly use TinyCrypt
CONFIG_BT_MESH_USES_TINYCRYPT=y

# Config Client for self-provisioning
CONFIG_BT_MESH_CFG_CLI=y
CONFIG_BT_MESH_CFG_CLI_TIMEOUT=2000

# Model key binding count
CONFIG_BT_MESH_MODEL_KEY_COUNT=1
CONFIG_BT_MESH_MODEL_GROUP_COUNT=1

# ==========================================
# USB HID Configuration
# ==========================================
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_DEVICE_HID=y
CONFIG_USB_HID_DEVICE_COUNT=3
CONFIG_USB_DEVICE_PRODUCT="HID-HOP"
CONFIG_USB_DEVICE_MANUFACTURER="HID-HOP"
CONFIG_USB_DEVICE_VID=0x1915
CONFIG_USB_DEVICE_PID=0x520F
CONFIG_USB_DEVICE_INITIALIZE_AT_BOOT=n
CONFIG_USB_DEVICE_REMOTE_WAKEUP=y

# ==========================================
# Crypto Configuration (E2E Encryption)
# ==========================================
CONFIG_ENTROPY_GENERATOR=y
CONFIG_ENTROPY_DEVICE_RANDOM_GENERATOR=y

# TinyCrypt for E2E encryption (AES-128-CCM)
CONFIG_TINYCRYPT=y
CONFIG_TINYCRYPT_AES=y
CONFIG_TINYCRYPT_AES_CCM=y
CONFIG_TINYCRYPT_SHA256=y

# ==========================================
# Logging Configuration
# ==========================================
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_USE_SEGGER_RTT=y
CONFIG_LOG_BACKEND_RTT=y
CONFIG_LOG_PRINTK=y
CONFIG_USB_DRIVER_LOG_LEVEL_WRN=y
CONFIG_USB_DEVICE_LOG_LEVEL_WRN=y

# ==========================================
# Debug Configuration
# ==========================================
CONFIG_ASSERT=y
CONFIG_DEBUG_OPTIMIZATIONS=n

# ==========================================
# BLE Mesh Debug Logging (TEMPORARY)
# ==========================================
CONFIG_BT_MESH_DEBUG_NET=y
CONFIG_BT_MESH_DEBUG_TRANS=y
CONFIG_BT_MESH_DEBUG_ACCESS=y
CONFIG_BT_MESH_DEBUG_MODEL=y
CONFIG_BT_MESH_DEBUG_ADV=y
